version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      firebase-tooling:
        patterns: ["firebase", "firebase-tools", "@firebase/*"]
      test-tooling:
        patterns: ["vitest", "@playwright/test", "typescript", "@types/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
